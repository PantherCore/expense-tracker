<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">💸 Expense Tracker</h2>

    <form method="POST" action="/add" class="card p-3 mb-4">
        <input type="text" name="title" placeholder="Expense title" class="form-control mb-2" required>
        <input type="number" step="0.01" name="amount" placeholder="Amount" class="form-control mb-2" required>
        <button class="btn btn-primary">Add Expense</button>
    </form>

    <h4>Total Expense: ₹{{ total or 0 }}</h4>

    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Title</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            {% for expense in expenses %}
            <tr>
                <td>{{ expense['title'] }}</td>
                <td>₹{{ expense['amount'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
